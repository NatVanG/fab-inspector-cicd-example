name: fab-inspector-cli-clientsecret

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Fab Inspector release tag (for example: v3.3.0) or 'latest'"
        required: false
        default: "latest"
      runner:
        description: "Runner operating system"
        required: true
        type: choice
        options:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        default: ubuntu-latest

jobs:
  run-fab-inspector-cli:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up .NET runtimes
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download and install Fab Inspector CLI on Linux
        if: inputs.runner == 'ubuntu-latest'
        uses: ./.github/actions/download-fab-inspector-linux
        with:
          version: ${{ inputs.version || 'latest' }}

      - name: Download and install Fab Inspector CLI on Windows
        if: inputs.runner == 'windows-latest'
        uses: ./.github/actions/download-fab-inspector-windows
        with:
          version: ${{ inputs.version || 'latest' }}

      - name: Download and install Fab Inspector CLI on macOS
        if: inputs.runner == 'macos-latest'
        uses: ./.github/actions/download-fab-inspector-macos
        with:
          version: ${{ inputs.version || 'latest' }}

      - name: Run Fab Inspector CLI (service principal auth)
        shell: bash
        run: |
          fab-inspector \
            -fabricitem ./src \
            -rules ./fab-inspector-rules/sample-report-rules.json \
            -authmethod clientsecret \
            -clientid "${{ secrets.FABRIC_CLIENT_ID }}" \
            -tenantid "${{ secrets.FABRIC_TENANT_ID }}" \
            -clientsecret "${{ secrets.FABRIC_CLIENT_SECRET }}" \
            -output "${{ vars.ONELAKE_OUTPUT_FOLDER }}" \
            -formats "GitHub,JSON"
